<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Drama Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎬 AI Drama Studio</h1>
  <p>ไอเดีย → ไบเบิลซีรีส์ → บทถ่ายทำ + พรอมต์ภาพ/วิดีโอ สำหรับ Flow / Veo</p>
</header>

<main>
  <section class="card settings">
    <label>โมเดล AI
      <select id="model">
        <option value="claude-opus-5-5">Opus 5.5 — คุณภาพสูงสุด</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5 — ประหยัด ~50%</option>
        <option value="claude-haiku-5-5">Haiku 5.5 — ถูกที่สุด (คุณภาพลดลง)</option>
      </select>
    </label>
    <label class="check-label"><input type="checkbox" id="eco"> 💰 โหมดประหยัด <span class="muted small">(คิดน้อยลง ตรวจแก้ 1 รอบ)</span></label>
    <div class="spent">ใช้ไปกับเรื่องนี้ ≈ <b id="spent">$0.00</b></div>
    <button class="ghost" id="btnBackups">🕘 งานที่บันทึกไว้</button>
  </section>
  <section class="card" id="step1">
    <h2>1. ไอเดียเรื่อง</h2>
    <label>เรื่องย่อ / ไอเดีย
      <textarea id="idea" rows="5" placeholder="ยิ่งละเอียดยิ่งดี: ตัวละคร (ชื่อ อายุ นิสัย) ความสัมพันธ์ จุดหักมุม ฉากเด็ดที่อยากได้ โทนเรื่อง&#10;เช่น เด็กสาวมัธยมย้ายมาโรงเรียนใหม่ แล้วพบจดหมายลึกลับจากรุ่นพี่ที่หายตัวไปเมื่อ 10 ปีก่อน"></textarea>
    </label>
    <div class="row3">
      <label>แนว
        <input id="genre" placeholder="รักวัยรุ่น, ลึกลับ, ดราม่า...">
      </label>
      <label>จำนวนตอน
        <input id="episodes" type="number" min="1" max="20" value="6">
      </label>
      <label>เรต
        <select id="rating">
          <option value="ทั่วไป">ทั่วไป</option>
          <option value="13+" selected>13+</option>
          <option value="18+">18+</option>
        </select>
      </label>
    </div>
    <p class="muted small" id="ratingHint"></p>
    <label>สไตล์ภาพ
      <input id="style" value="cinematic photorealistic, American high school, warm natural light, 9:16 vertical">
    </label>
    <button id="btnBible">✨ สร้างไบเบิลซีรีส์</button>
    <button class="ghost" id="btnSample">👀 ดูตัวอย่างผลลัพธ์</button>
  </section>

  <section id="bibleView" hidden></section>
  <section id="episodeView" hidden></section>
</main>

<div id="loading" hidden><div class="spinner"></div><p id="loadingText">กำลังเขียน...</p>
  <p id="loadingSub" class="muted small"></p>
  <p class="muted small loading-note">ปิดหน้านี้ได้ งานยังทำต่อ — เปิดกลับมาจะได้ผลเอง<br>⚠️ แต่ห้ามปิดหน้าต่าง PowerShell</p></div>
<div id="modal" hidden><div class="modal-box"><div id="modalBody"></div><button class="ghost" id="modalClose">ปิด</button></div></div>
<div id="toast" hidden></div>

<script src="storyboard.js"></script>
<script src="app.js"></script>
</body>
</html>
